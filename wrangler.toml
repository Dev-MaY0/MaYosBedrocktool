# =====================================================================
#  MaYoSaBa BE TOOL（サイト + 近接VC Bot）… Cloudflare Workers 1つで動きます
#  制作: MaYo (mayo01297)  二次配布禁止
#
#  ・public/ … サイト（トップ・死体スキン・近接VC・設定ページ）
#  ・src/    … 近接VC の Discord Bot
#  デプロイしたら https://<この Worker の URL>/setup/ を開いて、
#  Discord の Bot のトークンを貼るだけで設定が終わります（くわしくは DEPLOY.md）。
# =====================================================================
# Cloudflare のダッシュボードの Worker 名と同じにする
# （GitHub からのビルドは自動でダッシュボードの名前に合わせられますが、ずれないように同じにしておく）
name = "mayosbedrocktool"
main = "src/index.js"
compatibility_date = "2025-09-01"
# WebSocket の圧縮（permessage-deflate）を使わない（念のため）。
# 2023-08-15 以降の compatibility_date では、相手が Sec-WebSocket-Extensions: permessage-deflate を
# 送ってくると、Workers が自動で圧縮を有効にする（コードでヘッダーを消しても止められない）。
# Minecraft 自身は圧縮を求めていないが、コネクターやほかのツールからつないでも同じ形にしておく。
# メッセージは小さいので、圧縮しなくても困らない。
compatibility_flags = ["no_web_socket_compression"]

# サイトのファイル（/ /corpse/ /vc/ /setup/ … ふつうのページ）
[assets]
directory = "./public"
binding = "ASSETS"
# この URL は、サイトのファイルより先に Bot（src/index.js）が受け取る
#   /v/<接続コード> … Minecraft の /wsserver（WebSocket）・ブラウザでひらくと接続チェック
#   /ws/<接続キー> … 接続キーそのままでつなぐとき
#   /new          … マイクラの /wsserver で、サイトの近接VC の部屋を作る
#   /api/…        … 設定ページ・BDS アドオン・サイトから
#   /interactions … Discord のスラッシュコマンド
#   /setup        … 管理者用の設定ページ。パスワード（シークレット SETUP_KEY）を入れた人にだけ、本体（public/_admin/setup/）を返す
#   /_admin/*     … 設定ページの本体の置き場。外から直接は見せない（いつも 404）
#   /             … トップ。ひらいたアドレスで、ツール・まよ鯖のホーム・かめん部のどれかを返す
run_worker_first = ["/", "/v/*", "/ws/*", "/connect/*", "/api/*", "/interactions", "/health", "/new", "/setup", "/setup/*", "/_admin/*"]

[vars]
# ふつうは変えない
DISCORD_API = "https://discord.com/api/v10"
# ツールのアドレス（Discord のボタンやマイクラのチャットに出すリンク）。www.〜 でひらいた人は、ここへ移動します
SITE_URL = "https://tool.m-ayosaba.com"
# 1 つの Worker で 3 つのサイトを出します（トップ「/」だけ、ひらいたアドレスで中身が変わる）
#   HOME_HOST  … まよ鯖のホーム（public/_home/）  ／ KAMEN_HOST … かめん部（public/_kamen/）
#   それ以外（tool.m-ayosaba.com・workers.dev など）… このツール（public/index.html）
#   ※ どのアドレスも、Cloudflare の「設定」→「ドメインとルート」→「カスタムドメイン」で、この Worker に追加してください
HOME_HOST = "m-ayosaba.com"
KAMEN_HOST = "kamen.m-ayosaba.com"
# まよ鯖のホームに出す人数を読む Discord の招待コード（discord.gg/〜 の 〜）。"" にすると、ページに書いた人数のまま
HOME_DISCORD_INVITE = "rnNZg3bsq3"
# リレー（中継サーバー）のアドレス。ふつうはサイトの /setup/ で入れるので、ここは書かなくてOK。
# ここに書くと /setup/ で保存したものより優先されます
#   例: "34.82.1.2"（Google Cloud の VM の外部 IP・ポート 80）／ "vc.example.com"（独自ドメイン）／ "shuttle.proxy.rlwy.net:15140"（Railway）
# RELAY_HOST = ""

# 管理者用の設定ページ（/setup/）のパスワードは、ここには書かず「シークレット」で入れます:
#   npx wrangler secret put SETUP_KEY      （または Cloudflare の「設定」→「変数とシークレット」→ 種類は「シークレット」）
# 長くてランダムな文字（20 文字以上）にしてください。入れないと、/setup/ はだれも開けません。

# Discord サーバー（ギルド）ごとに 1 つずつ作られる部屋
[[durable_objects.bindings]]
name = "GUILD"
class_name = "GuildRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuildRoom"]
